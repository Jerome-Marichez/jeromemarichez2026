# docker/nginx.conf — jeromemarichez-fr
# Sert l'export statique produit par `next build` (voir Dockerfile et docs/docker.md).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # `trailingSlash: true` : chaque route est un dossier portant un `index.html`.
  index index.html;

  # Les assets versionnés par Next sont immuables : leur nom change à chaque build.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Le HTML, lui, doit être revalidé — sinon une mise en production reste invisible.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  error_page 404 /404.html;
}
