name: ci-main-e2e
# Check complet (PR -> main) : parcours navigateur (Cypress) contre la stack réelle.
on:
  pull_request:
    branches: [main]
jobs:
  e2e:
    name: Tests e2e (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Installation
        run: make install
      # make test-e2e construit l'export statique, le sert sur E2E_PORT, attend qu'il
      # réponde, lance Cypress headless puis arrête le serveur (scripts/e2e.mjs).
      - name: Tests e2e
        run: make test-e2e
