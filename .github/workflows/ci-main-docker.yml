name: ci-main-docker
# Check complet (PR -> main) : l'image de production se construit ET sert le site.
# Construit l'image (`npm ci` + `next build` dedans), rejoue `nginx -t` dans l'image
# construite, la démarre et vérifie les trois promesses de docker/nginx.conf :
# 200 sur l'accueil, 404 sur une URL absente, HTML servi en gzip.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  docker:
    name: Image Docker (build + fumée HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build de l'image et fumée HTTP
        run: ./scripts/docker-smoke.sh
